# 019 표준 준수 CI — 5리포 공통 템플릿 (설계 022)
# 배포처: <리포>/.github/workflows/019-standard.yml
# 🔴 이 파일은 «템플릿 정본»이다. 리포에 배포된 사본을 고치지 말고 여기서 고쳐 다시 배포한다.
#
# 실행 방식 = 자체 실행기(self-hosted) — 폐하 결정 08-13 19:14 `1537404063518429275`.
#   도구 정본(claude-infra/tools)이 비공개 리포에 있어 GitHub 호스트 러너는 읽을 수 없다.
#   자체 실행기는 그 도구가 이미 디스크에 있으므로 크리덴셜이 필요 없다.
#   대가 = PC가 꺼져 있으면 검사가 «돌지 않는다» — 아래 preflight가 그 상태를 실패로 만든다.

name: 019 Standard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  standard:
    name: 019 gate (5 checks)
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 🔴 「검사가 실패했다」와 「검사가 안 돌았다」를 가른다.
      #   도구가 없는 실행기에서 조용히 통과하는 것이 이 배선의 가장 큰 위험이다.
      - name: Preflight - tools must exist
        shell: pwsh
        run: |
          $tools = if ($env:CLAUDE_INFRA_TOOLS) { $env:CLAUDE_INFRA_TOOLS } else { 'C:\Users\sinel\repos\claude-infra\tools' }
          $gate = Join-Path $tools 'ci-gate.ps1'
          if (-not (Test-Path $gate)) {
            Write-Output "::error::ci-gate.ps1 not found at $gate - the runner cannot judge this repo."
            exit 1
          }
          "CLAUDE_INFRA_GATE=$gate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "gate = $gate"

      - name: 019 standard gate
        shell: pwsh
        run: |
          & $env:CLAUDE_INFRA_GATE -RepoRoot $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE

      # 게이트가 재생성한 산출물은 검사용 부산물이다 — 커밋 대상이 아님을 로그에 남긴다.
      - name: Show working tree drift (informational)
        if: always()
        shell: pwsh
        run: git status --short
