# 019 표준 준수 CI — 5리포 공통 템플릿 (설계 022)
# 배포처: <리포>/.github/workflows/019-standard.yml
# 🔴 이 파일은 «템플릿 정본»이다. 리포에 배포된 사본을 고치지 말고 여기서 고쳐 다시 배포한다.
#
# 실행 방식 = 자체 실행기(self-hosted) — 폐하 결정 08-13 19:14 `1537404063518429275`.
#   도구 정본(claude-infra/tools)이 비공개 리포에 있어 GitHub 호스트 러너는 읽을 수 없다.
#   자체 실행기는 그 도구가 이미 디스크에 있으므로 크리덴셜이 필요 없다.
#   대가 = PC가 꺼져 있으면 검사가 «돌지 않는다» — 아래 preflight가 그 상태를 실패로 만든다.

name: 019 Standard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


# 🔴 러너의 pwsh 는 «프로필을 읽는다» — 그리고 이 머신의 프로필 L1 이 라이브 런처를 닷소싱하고
#   그 런처가 `Set-StrictMode -Version Latest` 를 켠다. 그래서 CI 세션만 strict 였고,
#   `-NoProfile` 로 돌린 로컬은 아니었다. 같은 커밋이 두 곳에서 «다른 언어»로 돈 것이다
#   (09-06 실측: 미수정 3 It 이 러너에서만 3회 연속 FAIL · 로컬 671/671 PASS).
#   CI 는 개발자 홈 프로필에 기대면 안 된다 — 그 파일이 바뀌면 남의 커밋이 조용히 빨개진다.
# 🔴 내장 `shell: pwsh` 가 자동으로 붙여 주던 프롤로그·에필로그를 «그대로 복제»한다.
#   🔴 러너는 이 문자열을 .NET String.Format 으로 `{0}` 치환한다 — 그래서 «리터럴» 중괄호는
#   `{{` `}}` 로 이스케이프해야 한다. 안 하면 스텝 «진입 전»에 죽는다(실측: `Input string was not
#   in a correct format. Failure to parse near offset 117`). YAML 파싱 검증은 이 층을 못 본다.
#   커스텀 쉘 문자열로 바꾸면 그 둘이 사라지므로, -NoProfile 만 더하고 나머지는 손대지 않는다:
#     프롤로그 = $ErrorActionPreference = 'stop'   에필로그 = 종료코드 전파
# 🔴 이후 pwsh 가 아닌 run 스텝을 추가하면 그 스텝이 자기 `shell:` 을 선언해야 한다(여기를 덮는다).
defaults:
  run:
    shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:/LASTEXITCODE)) {{ exit $LASTEXITCODE }}"

jobs:
  standard:
    name: 019 gate (5 checks)
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      # 🔴 fetch-depth: 0 필수 — 기본값 1(얕은 체크아웃)이면 G6이 비교 기준(base)을 해소하지 못한다.
      #   origin/main도 HEAD~1도 없는 트리에서 `rev-parse`가 인자 문자열을 그대로 뱉었고,
      #   그것을 sha로 받은 뒤 Substring(0,7)이 예외로 터져 G1~G5 판정이 «한 줄도» 남지 않았다(D-5).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔴 「검사가 실패했다」와 「검사가 안 돌았다」를 가른다.
      #   도구가 없는 실행기에서 조용히 통과하는 것이 이 배선의 가장 큰 위험이다.
      # 🔴 도구 «출처» 우선순위(재정 08-14) — ① 명시 지정(env) ② 판정 대상 리포 자신의 tools ③ 러너 디스크 정본.
      #   ②가 없으면 «도구를 고치는 PR»을 «고치기 전 도구»가 판정한다. 실제로 그렇게 됐다:
      #   D-3 봉합 PR이 낸 산출물을 봉합 전 컴파일러가 재생성해 G3가 2줄 diff를 냈고, 병합해도 초록이
      #   되지 않는 상태였다(러너 디스크 정본이 그 커밋과 다른 브랜치였기 때문). 주법 §3
      #   「자기 적용이 배포보다 먼저다」의 배선 구현이 이 분기다.
      #   🔴 신뢰 모델 = «자기 리포 PR만 도는 셀프호스트» 전제. **외부 기여(fork PR)를 받는 리포에는 이 배선을
      #      쓰지 않는다** — 대상 리포의 코드로 판정하면 기여자가 판정기 자신을 바꿔 낼 수 있다.
      # 🔴 canon = «러너 전용 develop 클론» (폐하 재가 08-16 15:00 `1538427087046582313` · 15:18 「권장안 진행」).
      #   구판 canon = 오케 세션의 주 체크아웃(`repos\claude-infra\tools`)이었다 — 그 체크아웃이 작업 브랜치에
      #   올라가 있으면 함대 전체가 «그 브랜치의 게이트»로 판정된다. 실제로 그렇게 됐다(08-16 D0.5: 주 체크아웃
      #   `docs/project-doc-set`이 develop보다 tools 5커밋 뒤진 채 PAO #13 등을 판정). 전용 클론은 사람이 브랜치를
      #   옮길 일이 없고, 잡마다 origin/develop을 fetch한 뒤 «읽은 SHA»를 로그에 박아 판정기의 세대를 남긴다.
      #   클론은 «객체 저장소»로만 쓴다 — 잡은 그 SHA의 tools+등록부를 잡 전용 폴더에 풀어 쓰고, 클론의 HEAD·작업
      #   트리는 바꾸지 않는다(러너 5대 병렬 = 공유 작업 트리를 잡이 «변경»하면 서로의 판정기를 바꾸는 경합).
      #   롤백 = 이 블록의 경로 1줄 원복 + 클론 폴더 삭제(라이브 축 · 백업 대상 없음 = 신규 생성물).
      - name: Preflight - tools must exist
        run: |
          $canonRepo = 'C:\Users\sinel\repos\claude-infra-canon'
          if (Test-Path (Join-Path $canonRepo '.git')) {
            # 🔴 동시성(#59 검문 축 ①) — 러너 5대(pc-sinel-infra/co/gb/pao/pp)가 한 PC에서 «병렬로» 돌 수 있고,
            #   워크플로 `concurrency:`는 리포 단위라 리포 «간» 직렬화가 안 된다. 그래서 공유 클론의 작업 트리는
            #   어느 잡도 건드리지 않는다: 공유 클론에는 fetch만 하고(=객체 저장소), 그 SHA의 tools+등록부를
            #   `git archive`로 잡 전용 폴더(RUNNER_TEMP · 러너마다 다르고 잡 시작·종료 때 비워진다)에 풀어 쓴다.
            #   checkout이 없으므로 클론 HEAD·작업 트리는 잡 사이에 공유 상태가 아니다.
            #   fetch 실패(오프라인·ref lock 경합)는 경고 후 «마지막으로 받은 origin/develop»으로 진행한다 —
            #   어느 쪽이든 «실제로 읽은 SHA»가 아래 한 줄로 로그에 남는다. 그 SHA를 못 구하면 실패다(조용한 폴백 금지).
            $fetchOut = (git -C $canonRepo fetch -q origin develop 2>&1)
            if ($LASTEXITCODE -ne 0) { Write-Output "::warning::canon fetch failed (rc=$LASTEXITCODE) - using the last fetched origin/develop :: $fetchOut" }
            $canonSha = "$(git -C $canonRepo rev-parse --verify --quiet origin/develop 2>$null)".Trim()
            if ($canonSha -notmatch '^[0-9a-f]{40}$') {
              Write-Output "::error::canon clone has no usable origin/develop ref ($canonRepo) - the gate generation cannot be determined."
              exit 1
            }
            $canonRef = $canonSha.Substring(0, 7)
            $canonRoot = Join-Path $env:RUNNER_TEMP "canon-$canonRef-$env:GITHUB_RUN_ID"
            $canonZip = "$canonRoot.zip"
            git -C $canonRepo archive --format=zip -o $canonZip $canonSha tools docs/design/asset-classes.yml
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::canon archive failed (rc=$LASTEXITCODE) at $canonSha"; exit 1 }
            Expand-Archive -Path $canonZip -DestinationPath $canonRoot -Force
            Remove-Item -LiteralPath $canonZip -Force -ErrorAction SilentlyContinue   # 풀고 나면 zip은 필요 없다(RUNNER_TEMP 잔존물 0)
            Write-Output "canon ref = origin/develop @ $canonRef (object store $canonRepo -> job-local $canonRoot)"
            $canon = Join-Path $canonRoot 'tools'
            $canonDesc = "origin/develop of claude-infra @ $canonRef (read-only job-local extraction)"
          }
          else {
            # 🔴 전용 클론이 없으면 조용히 옛 경로로 가지 않는다 — 그 사실을 로그에 남기고 폴백 경로를 쓴다.
            $canonRepo = 'C:\Users\sinel\repos\claude-infra'
            $canonRef = (git -C $canonRepo rev-parse --abbrev-ref HEAD 2>$null) + '@' + (git -C $canonRepo rev-parse --short HEAD 2>$null)
            Write-Output "::warning::canon clone missing - falling back to the session checkout $canonRepo (branch-dependent gate: $canonRef)"
            $canon = Join-Path $canonRepo 'tools'
            # 🔴 폴백의 canon은 origin/develop이 «아니다» — 아래 tool source 문구가 그 사실을 그대로 말하게 한다(#59 검문 결함 2).
            $canonDesc = "session checkout $canonRepo @ $canonRef (NOT origin/develop - branch-dependent fallback)"
          }
          $own = Join-Path $env:GITHUB_WORKSPACE 'tools'
          if ($env:CLAUDE_INFRA_TOOLS) {
            $tools = $env:CLAUDE_INFRA_TOOLS
            $src = 'env:CLAUDE_INFRA_TOOLS (explicit override)'
          }
          elseif (Test-Path (Join-Path $own 'ci-gate.ps1')) {
            $tools = $own
            $src = 'target repo itself (this checkout carries the tools - self-application)'
          }
          else {
            # 🔴 폴백을 조용히 쓰지 않는다(025 규율). 러너 디스크의 도구는 «지금 판정 중인 커밋»이 아니라
            #   그 체크아웃이 올라가 있는 다른 브랜치의 것일 수 있다 — 그 사실을 로그에 남긴다.
            $tools = $canon
            $src = "runner disk canon = $canonDesc (this repo carries no tools; the canon is not the commit under test)"
          }
          $gate = Join-Path $tools 'ci-gate.ps1'
          if (-not (Test-Path $gate)) {
            Write-Output "::error::ci-gate.ps1 not found at $gate (source: $src) - the runner cannot judge this repo."
            exit 1
          }
          "CLAUDE_INFRA_GATE=$gate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "gate = $gate"
          Write-Output "tool source = $src"

      - name: 019 standard gate
        # 카드 #243 — PR 이벤트 = -PrMode(생성물은 PR에서 제외 · 커밋본 대조는 develop/main push에서만).
        #   판별은 여기 «선언»에서 한다 — 스크립트가 이벤트 env를 읽으면 같은 잡의 Pester 스위트까지 뒤집힌다(리바이 98 E1).
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            & $env:CLAUDE_INFRA_GATE -RepoRoot $env:GITHUB_WORKSPACE -PrMode
          } else {
            & $env:CLAUDE_INFRA_GATE -RepoRoot $env:GITHUB_WORKSPACE
          }
          exit $LASTEXITCODE

      # 카드 #281 — 추적 파일 전역을 git grep 으로 읽는 잠금(relic-link)은 문면 1줄 수정에도 깨진다(#579 러너 RED).
      #   tools 잡(수십 분) 끝에서야 보이던 것을 이 잡(수 분)에서 먼저 본다. tools 잡의 전건 실행에서도 빼지 않는다.
      #   🔴 이 파일은 5리포 공유 표준의 사본이다 — 잠금 파일이 없는 리포에서는 «건너뜀»을 로그에 남기고 통과한다.
      - name: Relic-link lock (Pester) - blocking
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $suite = Join-Path $env:GITHUB_WORKSPACE 'tools/relic-link.Tests.ps1'
          if (-not (Test-Path -LiteralPath $suite)) { Write-Output "::notice::relic-link lock: not carried by this repo - skipped (not a pass of the lock)"; exit 0 }
          Set-StrictMode -Version Latest
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = $suite
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Normal'
          $r = Invoke-Pester -Configuration $cfg
          if ($null -eq $r -or $r.TotalCount -eq 0) { Write-Output "::error::relic-link lock discovered no tests - the lock did not run (this is not a pass)"; exit 1 }
          Write-Output "relic-link $($r.PassedCount)/$($r.TotalCount) passed - failed=$($r.FailedCount)"
          if ($r.FailedCount -gt 0) {
            foreach ($t in $r.Failed) { Write-Output "::error::$($t.ExpandedPath) :: $("$($t.ErrorRecord.Exception.Message)" -replace '\r?\n', ' ')" }
            exit 1
          }

      # 게이트는 재생성분을 진입 시점 바이트로 스스로 되돌린다(D-15 ⓒ) — 그래서 여기 잡히는 drift는
      # 「게이트가 만든 부산물」이 아니라 게이트 «밖»의 변화다. 실측 = 연속 3회 실행 전부 6/6 · 매회 뒤 0.
      # 🔴 그래도 아직 «판정»으로 올리지 않는다: 이 워크플로는 5리포 공유 표준이고, 도구 세대가
      #   구판인 리포에서는 게이트가 여전히 산출물을 남긴다. 차단은 나중이다(주법 3 · 관측 → 분류 → 등록 → 차단).
      - name: Show working tree drift (informational)
        if: always()
        run: git status --short
